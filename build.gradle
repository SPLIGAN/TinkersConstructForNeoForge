/*
 * Tinkers Construct — NeoForge 1.21.1 build
 * (ported from ForgeGradle 1.20.1; game/registries/datagen APIs still need porting in Java sources.)
 */

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
    id 'io.freefair.lombok' version '8.11'
}

group = 'slimeknights.tconstruct'
base {
    archivesName = 'TinkersConstruct'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def gitRevision = 'unknown'
try {
    def proc = 'git rev-parse --short HEAD'.execute()
    proc.waitFor()
    if (proc.exitValue() == 0) {
        gitRevision = proc.text.trim()
    }
} catch (Throwable ignored) {
    gitRevision = 'nogit'
}
ext.artifact_version = System.getenv('ARTIFACT_VERSION') ?: "${mod_version}.${System.getenv('BUILD_NUMBER') ?: "DEV.${gitRevision}"}"
version = "${minecraft_version}-${artifact_version}"

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}, Version: ${version}"

sourceSets {
    main {
        resources {
            srcDirs 'src/generated/resources'
            exclude '.cache'
            exclude 'assets/tconstruct/debug'
        }
    }
}

minecraft.accessTransformers.file project.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP,CORE'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory layout.projectDirectory.dir('run').dir(name)
        modSource sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    data {
        arguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath,
                '--existing-mod', 'mantle'
    }
}

configurations {
    deployerJars
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // JEI / CraftTweaker ecosystem — resolve before other mirrors that may error (523).
    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        name = 'Dogforce Games'
        url = 'https://www.dogforce-games.com/maven/'
    }
    // SlimeKnights Maven (Mantle) — omit by default: mirror often returns HTTP 523. Use mavenLocal + publishToMavenLocal, or libs/mantle.jar.
    // maven { name = 'Mantle'; url = 'https://dvs1.progwml6.com/files/maven' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Mantle: prefer a local deobf jar when the SlimeKnights Maven mirror is unavailable (HTTP 523, etc.).
    if (file('libs/mantle.jar').exists()) {
        implementation files('libs/mantle.jar')
    } else {
        implementation "slimeknights.mantle:Mantle:${mantle_coordinate_version}"
    }

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    deployerJars 'org.apache.maven.wagon:wagon-ssh:2.2'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation 'org.mockito:mockito-inline:4.2.0'
    testImplementation 'org.assertj:assertj-core:3.21.0'
}

test {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : artifact_version,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mantle_coordinate_version: mantle_coordinate_version,
            mantle_version_range   : mantle_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : "Tinkers Construct",
                'Specification-Vendor'    : 'Slime Knights',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : "${version}",
                'Implementation-Vendor'   : 'Slime Knights',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}

tasks.named('sourcesJar', Jar).configure {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

artifacts {
    archives sourcesJar
}

if (!project.hasProperty('keystore_location')) {
    ext.keystore_location = '.'
}
if (!project.hasProperty('keystore_user_alias')) {
    ext.keystore_user_alias = ''
}
if (!project.hasProperty('sftp_username')) {
    ext.sftp_username = ''
}
if (!project.hasProperty('sftp_key')) {
    ext.sftp_key = ''
}
if (!project.hasProperty('keystore_user_password')) {
    ext.keystore_user_password = ''
}
if (System.getenv('KSK_PW') != null) {
    ext.keystore_user_password = System.getenv('KSK_PW')
}

tasks.register('uploadJars') {
    dependsOn 'build'
    description = 'Legacy upload hook: set local_maven / sftp_maven and wire maven-publish separately if needed.'
    doLast {
        if (!project.hasProperty('local_maven') && !project.hasProperty('sftp_maven')) {
            logger.lifecycle('uploadJars: no local_maven or sftp_maven property set; skipping.')
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifact sourcesJar
        }
    }
    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url = DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.register('printMigrationTargets') {
    group = 'help'
    description = 'Print NeoForge / Arclight target versions'
    doLast {
        println "Minecraft: ${minecraft_version}"
        println "NeoForge neo_version: ${neo_version}"
        println "Arclight (runtime smoke): ${arclight_version}"
        println "Mantle coordinate: slimeknights.mantle:Mantle:${mantle_coordinate_version} (or libs/mantle.jar)"
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
