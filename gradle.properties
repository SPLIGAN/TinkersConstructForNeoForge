# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Reduces Windows file-handle issues with NeoForm tasks (see TechReborn NeoForge port).
org.gradle.vfs.watch=false

# Parchment (NeoGradle subsystem — see MDK / NeoGradle README)
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Minecraft / NeoForge (target: Arclight 1.21.1 hybrid + NeoForge 21.1.219)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.219
loader_version_range=[4,)

# Mod metadata (neoforge.mods.toml)
mod_id=tconstruct
mod_name=Tinkers Construct
mod_license=MIT
mod_group_id=slimeknights.tconstruct

# Public mod version base (artifact suffix still computed in build.gradle)
mod_version=3.11.2

# Mantle: no stable 1.21.1 NeoForge artifact on public Maven at time of port — publish to mavenLocal from a Mantle 1.21.1 tree, or adjust coordinate when SlimeKnights publishes.
# Full Maven coordinate version for Mantle (group slimeknights.mantle). Publish to mavenLocal or place libs/mantle.jar.
mantle_coordinate_version=1.21.1-LOCAL-SNAPSHOT
mantle_version_range=[1.21.1,)

# Optional compile-only (NeoForge classifier)
jei_version=19.27.0.340

# Reference only (Arclight is validated at runtime, not a Gradle dependency)
arclight_version=1.0.2-SNAPSHOT-668f9f3
